<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atrium</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Cpath d='M9 9v14M23 9v14M9 16h14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    try { const t = localStorage.getItem("hub.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <!-- Sign-in screens. The shell below stays hidden (body.signed-in) until /api/auth/me says who is here. -->
  <div class="auth-root" id="auth">
    <div class="auth-loading" role="status" aria-label="Loading"><span class="brand-mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span></div>
  </div>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu"></button>
    <a class="brand" href="#/"><span class="brand-mark" id="brand-mark"></span><span>Atrium <small>suite</small></span></a>
    <div class="spacer"></div>
    <button class="icon-btn" id="bell-btn" aria-label="Notifications"></button>
    <div class="theme-toggle">
      <span class="sun" id="sun-icon"></span>
      <button class="switch" id="theme-switch" role="switch" aria-label="Dark mode"></button>
      <span class="moon" id="moon-icon"></span>
    </div>
    <button class="bar-btn" id="portals-btn" aria-haspopup="true" aria-expanded="false"></button>
    <button class="bar-btn search-btn" id="search-btn"></button>
    <button class="get-started" id="start-btn"></button>
    <button class="user-btn" id="user-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account"></button>
  </header>

  <div class="popover" id="portals" role="menu" aria-label="Portals"></div>
  <div class="popover" id="notifications" aria-label="Notifications"></div>
  <div class="popover user-menu" id="user-menu" aria-label="Account"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"><nav class="nav" id="nav"></nav></aside>
    <div class="content">
      <div class="subbar" id="subbar"></div>
      <div class="restart-banner" id="restart-banner" role="status" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <script>
    // If the app never starts (a script failed to load or to run, e.g. a mix of old cached and new files after an
    // update), say so instead of leaving a blank page. Inline styles: the stylesheet may be what failed.
    (function () {
      var shown = false;
      function started() {
        var loading = document.querySelector("#auth .auth-loading");
        return document.body.classList.contains("signed-in") || !loading;
      }
      function show(detail) {
        if (shown || started()) return;
        shown = true;
        var box = document.createElement("div");
        box.setAttribute("role", "alert");
        box.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;" +
          "background:#0f172a;color:#e2e8f0;font:15px/1.5 system-ui,sans-serif;z-index:2147483647";
        box.innerHTML = '<div style="max-width:560px"><h1 style="font-size:20px;margin:0 0 8px">Atrium could not start</h1>' +
          "<p>Reload without the browser cache: <b>Ctrl+Shift+R</b> (Mac: <b>Cmd+Shift+R</b>). If the page stays like this, " +
          "check the terminal where Atrium runs for errors and that the hub is still running.</p>" +
          '<p style="opacity:.7;font-size:13px" id="boot-detail"></p></div>';
        document.body.appendChild(box);
        if (detail) document.getElementById("boot-detail").textContent = String(detail).slice(0, 300);
        var watch = setInterval(function () { if (started()) { clearInterval(watch); box.remove(); } }, 1000);
      }
      window.addEventListener("error", function (e) { if (!started()) show(e.message || "A script failed to load."); }, true);
      setTimeout(function () { show("The app did not start within 15 seconds."); }, 15000);
    })();
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
