# The Atrium sidecar of the {{tool_id}} subsidiary ({{subsidiary_id}}), generated by Atrium. This file holds no secret.
# First start, with the one-time enrollment code Atrium showed (it is used once and never written anywhere):
#   ATRIUM_ENROLLMENT_CODE='<code>' docker compose up -d
# Later starts: docker compose up -d
services:
  atrium-sidecar:
    image: {{image}}
    command: ["--config", "/etc/atrium-sidecar/config.json"]
    user: "10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: {{memory}}
    cpus: {{cpus}}
    pids_limit: 256
    tmpfs: ["/tmp:size=16m"]
    environment:
      ATRIUM_ENROLLMENT_CODE: ${ATRIUM_ENROLLMENT_CODE:-}
    volumes:
      - ./config.json:/etc/atrium-sidecar/config.json:ro
      - atrium-sidecar-state:/var/lib/atrium-sidecar
    networks: [tool]
    restart: unless-stopped
networks:
  tool:
    name: {{network}}
    external: true
volumes:
  atrium-sidecar-state: {}
