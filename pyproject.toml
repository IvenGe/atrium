[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atrium"
version = "0.1.0"
description = "An agent-run hub that imports, integrates and supervises open-source, closed-source and SaaS tools - an office suite for your whole toolchain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=42",
]

[project.optional-dependencies]
ai = ["anthropic>=1.12"]
ssh = ["asyncssh>=2.14"]
dev = ["pytest>=8"]
all = ["atrium[ai,ssh]"]

[project.scripts]
atrium = "hub.__main__:main"
hub = "hub.__main__:main"
atrium-sidecar = "hub.subsidiary.sidecar.__main__:main"

[tool.setuptools.packages.find]
include = ["hub*"]

[tool.setuptools.package-data]
hub = ["web/*", "web/**/*", "grc/frameworks/*.json", "llm/*.json", "subsidiary/contract/*",
       "subsidiary/templates/*/*", "subsidiary/templates/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance budgets on large data sets; skipped unless HUB_SLOW_TESTS=1"]
